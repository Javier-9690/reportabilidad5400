
{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><div><h4 class="text-primary-red mb-0"><i class="bi bi-table"></i> Dotación por gerencia</h4><small class="text-muted">Cruce entre censos y curva planificada activa</small></div><button id="btnExport" class="btn btn-sm btn-success"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button></div><div class="card shadow-sm mb-3"><div class="card-body py-2"><form id="filterForm" class="row g-2 align-items-end"><div class="col-6 col-md-3"><label class="form-label small mb-0">Desde</label><input type="date" id="startDate" class="form-control form-control-sm"></div><div class="col-6 col-md-3"><label class="form-label small mb-0">Hasta</label><input type="date" id="endDate" class="form-control form-control-sm"></div><div class="col-12 col-md-4"><label class="form-label small mb-0">Curva</label><select id="curveId" class="form-select form-select-sm"><option value="">Curva activa</option>{% for c in curves %}<option value="{{ c.id }}">{{ c.name }}{% if c.is_active %} (activa){% endif %}</option>{% endfor %}</select></div><div class="col-12 col-md-2"><button class="btn btn-sm btn-danger w-100" type="submit">Generar</button></div></form></div></div><div id="conclusions" class="mb-3"></div><div class="table-responsive report-table-wrapper"><table class="table table-sm table-bordered report-table mb-0"><thead id="reportHead"></thead><tbody id="reportBody"></tbody></table></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/report.js') }}"></script>{% endblock %}
