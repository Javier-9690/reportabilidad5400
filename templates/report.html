{% extends "base.html" %}
{% block content %}
<div class="report-page">
    <div class="report-hero d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
        <div>
            <div class="report-eyebrow"><i class="bi bi-table"></i> Reporte operativo</div>
            <h4 class="mb-0">Dotación por gerencia</h4>
            <small>Cruce entre censos importados y curva planificada activa.</small>
        </div>
        <button id="btnExport" class="btn btn-sm btn-success report-export-btn">
            <i class="bi bi-file-earmark-excel"></i> Exportar Excel completo
        </button>
    </div>

    <div class="card shadow-sm mb-3 report-filter-card">
        <div class="card-body py-3">
            <form id="filterForm" class="row g-2 align-items-end">
                <div class="col-6 col-md-3">
                    <label class="form-label small mb-1">Desde</label>
                    <input type="date" id="startDate" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label small mb-1">Hasta</label>
                    <input type="date" id="endDate" class="form-control form-control-sm">
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label small mb-1">Curva</label>
                    <select id="curveId" class="form-select form-select-sm">
                        <option value="">Curva activa</option>
                        {% for c in curves %}
                        <option value="{{ c.id }}">{{ c.name }}{% if c.is_active %} (activa){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-2">
                    <button class="btn btn-sm btn-danger w-100" type="submit">
                        <i class="bi bi-arrow-clockwise"></i> Generar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="reportSummary" class="row g-2 mb-3"></div>
    <div id="conclusions" class="mb-3"></div>

    <div class="report-legend d-flex flex-wrap gap-2 mb-2 small">
        <span><i class="legend-dot real"></i> Dotación real</span>
        <span><i class="legend-dot plan"></i> Planificado</span>
        <span><i class="legend-dot diff-pos"></i> Sobre curva</span>
        <span><i class="legend-dot diff-neg"></i> Bajo curva</span>
        <span><i class="legend-dot unmatched"></i> Sin match</span>
    </div>

    <div class="table-responsive report-table-wrapper shadow-sm">
        <table class="table table-sm table-bordered report-table mb-0">
            <thead id="reportHead"></thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/report.js') }}?v=20260527_export_async2"></script>
{% endblock %}
