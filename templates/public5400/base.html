<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Campamento 5400{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>
:root{--r:#b01930}body{background:#f4f5f7;color:#25303b}.mast{background:#fff;border-bottom:4px solid var(--r)}.mast img{max-height:53px;max-width:140px;object-fit:contain}.wrap{max-width:850px}.paper{background:white;border-radius:16px;padding:clamp(16px,4vw,32px);box-shadow:0 8px 32px #14213d0d}.btn-danger{background:var(--r)}h1,h2{color:#94162b}.meta{color:#6a7480;font-size:.93rem}.required{color:#b01930}textarea{min-height:110px}.rules img{width:100%;height:auto;display:block;margin:0 auto 14px;border:1px solid #ddd}.emoji-option{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #d4d9df;border-radius:10px;cursor:pointer;font-size:28px;background:#fff}.emoji-option small{font-size:10px;color:#3a4450}.emoji-option:has(input:checked){background:#ffeef1;border:2px solid var(--r)}.emoji-option input{position:absolute;opacity:0}.question{border-bottom:1px solid #e5e6e9;padding:16px 0}#signature{width:100%;height:210px;border:2px solid #d3d6da;background:#fff;border-radius:10px;touch-action:none;display:block}
</style></head><body>
<header class="mast py-3"><div class="container d-flex align-items-center justify-content-between gap-3"><img src="/static/img/aramark.png" alt="Aramark"><div class="text-center"><strong>Campamento 5400</strong><div class="meta">Atención a usuarios</div></div><img src="/static/img/escondida_bhp.png" alt="Escondida BHP"></div></header>
<div class="container wrap py-4"><nav class="d-flex flex-wrap gap-2 mb-3"><a class="btn btn-sm btn-outline-secondary" href="/encuesta">Encuesta</a><a class="btn btn-sm btn-outline-secondary" href="/sugerencias">Sugerencias y reclamos</a><a class="btn btn-sm btn-outline-secondary" href="/onboarding">Onboarding</a></nav><main class="paper">{% block content %}{% endblock %}</main><footer class="meta text-center mt-4">Campamento 5400 · Formularios de atención</footer></div>
{% block scripts %}{% endblock %}</body></html>
