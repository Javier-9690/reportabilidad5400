<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso administrador | Reportabilidad 5400</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#202124,#7d1125);padding:20px}
    .login {max-width:410px;width:100%;background:#fff;border-radius:16px;padding:32px;box-shadow:0 20px 60px #0004}
    h1 {color:#a6192e;font-size:1.7rem;font-weight:750}
    .btn-admin {background:#a6192e;color:#fff;border:0}
    .btn-admin:hover {background:#851326;color:#fff}
  </style>
</head>
<body>
  <main class="login">
    <h1 class="text-center">Reportabilidad 5400</h1>
    <p class="text-center text-muted mb-4">Acceso de administrador</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="form-label" for="user">Usuario</label>
      <input id="user" class="form-control mb-3" type="text" name="username" value="admin" autocomplete="username" required>
      <label class="form-label" for="password">Contraseña</label>
      <input id="password" class="form-control mb-4" type="password" name="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn btn-admin w-100">Ingresar</button>
    </form>
    <hr><p class="small fw-semibold text-center mt-3">Acceso público para usuarios</p><div class="d-flex flex-wrap justify-content-center gap-2"><a href="/encuesta" class="btn btn-sm btn-outline-danger">Encuesta</a><a href="/sugerencias" class="btn btn-sm btn-outline-danger">Reclamos</a><a href="/onboarding" class="btn btn-sm btn-outline-danger">Onboarding</a></div><p class="small text-center text-muted mt-4 mb-0">Sistema de gestión hotelera</p>
  </main>
</body>
</html>
